<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBVAP - Intelligent Border CCTV Surveillance Simulator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; display: flex; flex-direction: column; min-height: 100vh; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #1e293b; }
        h1 { font-size: 1.5rem; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .badge { background: #0284c7; color: #fff; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        
        .main-container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        
        .video-box { background: #000; border-radius: 8px; border: 2px solid #334155; position: relative; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        canvas { width: 100%; height: auto; display: block; }
        
        .panel { background: #1e293b; border-radius: 8px; padding: 15px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 15px; }
        .panel-title { font-size: 1rem; font-weight: bold; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        
        .json-viewer { background: #090d16; color: #4ade80; font-family: 'Courier New', Courier, monospace; font-size: 0.82rem; padding: 12px; border-radius: 6px; border: 1px solid #1e293b; height: 320px; overflow-y: auto; white-space: pre-wrap; }
        
        .controls { display: flex; gap: 10px; flex-wrap: wrap; }
        button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        button.alert-btn { background: #e11d48; }
        button.alert-btn:hover { background: #be123c; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-card { background: #0f172a; padding: 10px; border-radius: 6px; border: 1px solid #334155; }
        .stat-label { font-size: 0.75rem; color: #64748b; }
        .stat-value { font-size: 1.1rem; font-weight: bold; color: #f8fafc; margin-top: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>🛡️ IBVAP <span class="badge">SIH 2026 PROTOTYPE</span></h1>
        <div>Intelligent Border Video Analytics Platform (Edge CCTV Simulator)</div>
    </header>

    <div class="main-container">
        <!-- Video Feed Section -->
        <div class="video-box">
            <canvas id="cctvCanvas" width="1280" height="720"></canvas>
        </div>

        <!-- Telemetry & Alert Side Panel -->
        <div class="panel">
            <div class="panel-title">📡 REAL-TIME EDGE TELEMETRY & ALERTS</div>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-label">SYSTEM STATUS</div>
                    <div class="stat-value" id="statusVal" style="color: #4ade80;">NORMAL</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">BANDWIDTH SAVED</div>
                    <div class="stat-value" style="color: #38bdf8;">99.99%</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">LATENCY</div>
                    <div class="stat-value" id="fpsVal">21.9 ms (45 FPS)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">INTRUSIONS</div>
                    <div class="stat-value" id="countVal" style="color: #f43f5e;">0 Events</div>
                </div>
            </div>

            <div class="panel-title">📋 ZERO-BANDWIDTH JSON METADATA PAYLOAD</div>
            <div class="json-viewer" id="jsonViewer">// Waiting for live detection events...</div>

            <div class="controls">
                <button onclick="togglePlay()" id="playBtn">Pause Feed</button>
                <button class="alert-btn" onclick="resetIntruder()">Trigger Intrusion</button>
                <button onclick="toggleIR()" id="irBtn">Toggle Night Vision</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cctvCanvas');
        const ctx = canvas.getContext('2d');
        
        let isPlaying = true;
        let isNightVision = true;
        let frameCount = 0;
        let intrusionCount = 0;
        let intruderY = 220;
        let alertActive = false;

        const fenceY = 450;

        function drawCCTV() {
            if (!isPlaying) return;
            frameCount++;
            
            // 1. Background (IR Greenish tint vs standard dark)
            if (isNightVision) {
                ctx.fillStyle = '#0f1d14';
            } else {
                ctx.fillStyle = '#090d16';
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ground & Road
            ctx.fillStyle = isNightVision ? '#09140d' : '#05070c';
            ctx.fillRect(0, 480, canvas.width, 240);
            
            // Fence Posts & Boundary Line
            ctx.strokeStyle = alertActive ? '#f43f5e' : '#eab308';
            ctx.lineWidth = 3;
            ctx.setLineDash([12, 8]);
            ctx.beginPath();
            ctx.moveTo(100, fenceY);
            ctx.lineTo(1180, fenceY);
            ctx.stroke();
            ctx.setLineDash([]); // reset

            // Fence Label
            ctx.fillStyle = alertActive ? '#f43f5e' : '#eab308';
            ctx.font = '16px Segoe UI, sans-serif';
            ctx.fillText("VIRTUAL BORDER RESTRICTED LINE (ZONE ALPHA)", 120, fenceY - 15);

            // Fence Wire Posts
            ctx.strokeStyle = isNightVision ? '#1c3825' : '#334155';
            ctx.lineWidth = 4;
            for (let x = 120; x < 1200; x += 150) {
                ctx.beginPath();
                ctx.moveTo(x, 350);
                ctx.lineTo(x, 480);
                ctx.stroke();
            }

            // 2. Moving Human Intruder Target
            intruderY += 1.5;
            if (intruderY > 640) intruderY = 220; // Loop position
            
            const intruderX = 520 + Math.sin(frameCount * 0.05) * 40;
            const isCrossing = intruderY > fenceY;

            if (isCrossing && !alertActive) {
                alertActive = true;
                intrusionCount++;
                document.getElementById('statusVal').innerText = "ALERT!";
                document.getElementById('statusVal').style.color = "#f43f5e";
                document.getElementById('countVal').innerText = intrusionCount + " Events";

                // Generate Metadata
                const payload = {
                    "event_id": "EVT_" + Date.now(),
                    "camera_id": "CAM-04_BOP_ALPHA",
                    "timestamp": new Date().toISOString(),
                    "event_type": "VIRTUAL_FENCE_INTRUSION",
                    "detection": {
                        "track_id": 1,
                        "class_name": "human",
                        "confidence": 0.96,
                        "bbox_xyxy": [Math.round(intruderX-20), Math.round(intruderY-50), Math.round(intruderX+20), Math.round(intruderY+40)]
                    },
                    "geo_coordinates": {"lat": 31.6241, "lng": 74.5821}
                };
                document.getElementById('jsonViewer').innerText = JSON.stringify(payload, null, 2);
            } else if (!isCrossing && alertActive) {
                alertActive = false;
                document.getElementById('statusVal').innerText = "NORMAL";
                document.getElementById('statusVal').style.color = "#4ade80";
            }

            // Draw Human Target
            ctx.fillStyle = isNightVision ? '#86efac' : '#38bdf8';
            ctx.beginPath();
            ctx.arc(intruderX, intruderY - 45, 12, 0, Math.PI * 2); // Head
            ctx.fill();
            ctx.fillRect(intruderX - 14, intruderY - 32, 28, 45); // Torso

            // Bounding Box
            ctx.strokeStyle = isCrossing ? '#f43f5e' : '#4ade80';
            ctx.lineWidth = 2;
            ctx.strokeRect(intruderX - 22, intruderY - 60, 44, 100);
            ctx.fillStyle = isCrossing ? '#f43f5e' : '#4ade80';
            ctx.font = 'bold 14px sans-serif';
            ctx.fillText(`ID:1 Human ${isCrossing ? '[INTRUDER!]' : '0.96'}`, intruderX - 22, intruderY - 66);

            // 3. Moving Vehicle Target (Patrol SUV)
            const vehX = (frameCount * 4) % 1200;
            const vehY = 580;

            ctx.fillStyle = isNightVision ? '#334e3b' : '#1e293b';
            ctx.fillRect(vehX, vehY - 30, 130, 50);
            ctx.strokeStyle = '#38bdf8';
            ctx.strokeRect(vehX - 5, vehY - 40, 140, 65);
            ctx.fillStyle = '#38bdf8';
            ctx.fillText("ID:10 Vehicle", vehX - 5, vehY - 46);

            // ANPR License Plate Box
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(vehX + 40, vehY + 5, 50, 16);
            ctx.fillStyle = '#000000';
            ctx.font = 'bold 11px sans-serif';
            ctx.fillText("PB08", vehX + 48, vehY + 17);

            // 4. Alert Banner Overlay
            if (alertActive) {
                ctx.fillStyle = 'rgba(225, 29, 72, 0.85)';
                ctx.fillRect(0, 0, canvas.width, 50);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 20px Segoe UI, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("🚨 ALERT: VIRTUAL FENCE INTRUSION DETECTED! [HUMAN TARGET #1]", canvas.width / 2, 32);
                ctx.textAlign = 'left';
            }

            // 5. OSD Camera Overlay
            ctx.fillStyle = '#22c55e';
            ctx.font = 'bold 16px monospace';
            ctx.fillText("CAM-04 [BOP ALPHA SECTOR 4]", 25, 35);
            ctx.fillText(new Date().toISOString(), 25, 60);

            if (Math.floor(frameCount / 15) % 2 === 0) {
                ctx.fillStyle = '#ef4444';
                ctx.beginPath();
                ctx.arc(canvas.width - 90, 30, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillText("REC", canvas.width - 70, 35);
            }
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('playBtn').innerText = isPlaying ? "Pause Feed" : "Play Feed";
        }

        function resetIntruder() {
            intruderY = 220;
            alertActive = false;
        }

        function toggleIR() {
            isNightVision = !isNightVision;
        }

        setInterval(drawCCTV, 40);
    </script>
</body>
</html>
